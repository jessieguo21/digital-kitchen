<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fraunces:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0ebe0;display:flex;justify-content:center;align-items:flex-start;padding-top:100px;padding-left:16px;padding-right:16px;padding-bottom:40px;min-height:100vh}

/* ── RECIPE OVERLAY ─────────────────────────────────────────────────── */
#recipe-overlay{position:fixed;inset:0;z-index:99999;background:#fafaf8;overflow-y:auto;display:none;font-family:'DM Sans',sans-serif;color:#1e2240}
#recipe-overlay.active{display:block;animation:slideIn .3s ease}
#recipe-overlay::before{content:'';position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#9fb8e6,#8ec4a8,#b8a0c8);z-index:1}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.ro-inner{max-width:640px;margin:0 auto;padding:40px 20px 80px}
.ro-backbtn{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#8a8aa0;cursor:pointer;margin-bottom:32px;padding:8px 0;background:none;border:none;font-family:'DM Sans',sans-serif;transition:color .15s}
.ro-backbtn:hover{color:#1e2240}
.ro-eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#8a8aa0;margin-bottom:12px}
.ro-h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(30px,5vw,46px);font-weight:900;line-height:1.08;color:#1e2240;margin-bottom:12px}
#recipe-overlay .ro-h1 em,#recipe-overlay .ro-h1 i{font-style:normal!important;color:#3a5888}
.ro-sub{color:#8a8aa0;font-size:14px;font-weight:300;line-height:1.7;margin-bottom:36px}
/* cards */
.ro-cards{display:flex;flex-direction:column;gap:18px}
.ro-card{background:#fff;border:1px solid #e4e4ee;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s;box-shadow:0 2px 12px rgba(30,34,64,.06)}
.ro-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(30,34,64,.12)}
.ro-card-bar{height:4px}
.ro-card-body{padding:22px 24px 18px}
.ro-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.ro-name{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:700;line-height:1.2;color:#1e2240}
.ro-badge{background:#edf2fb;color:#4a6898;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:5px 10px;border-radius:20px;border:1px solid #c8d8f0;white-space:nowrap;flex-shrink:0;margin-top:3px}
.ro-meta{font-size:12px;color:#8a8aa0;margin-bottom:10px;margin-top:3px}
.ro-desc{font-size:13.5px;color:#5a5a78;line-height:1.68;margin-bottom:14px}
.ro-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ro-pill{font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px}
.ro-pk{background:#fdf8ec;color:#b89a3a;border:1px solid #ede0b0}
.ro-pp{background:#ecf8f4;color:#3a8e7a;border:1px solid #b0ddd4}
.ro-pc{background:#f4f2fc;color:#7a68b8;border:1px solid #ccc8e8}
.ro-pf{background:#fcf0f3;color:#b8607a;border:1px solid #e8c0cc}
.ro-shop-pill{font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;background:#ecf8f4;color:#2a7858;border:1px solid #b0ddd4}
.ro-viewbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#1e2240;border:1px solid #e4e4ee;padding:8px 16px;border-radius:8px;background:#fafaf8;transition:background .15s,border-color .15s}
.ro-viewbtn:hover{background:#ededf5;border-color:#9fb8e6}
.ro-viewbtn svg{transition:transform .2s}.ro-card:hover .ro-viewbtn svg{transform:translateX(3px)}
/* shuffle */
.ro-shuffle{display:block;width:100%;margin-top:24px;background:#fff;border:1px solid #e4e4ee;color:#8a8aa0;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:12px;border-radius:10px;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(30,34,64,.06)}
.ro-shuffle:hover:not(:disabled){background:#ededf5;color:#1e2240;border-color:#9fb8e6}
.ro-shuffle:disabled{opacity:.5;cursor:wait}
.ro-comment-input{display:block;width:100%;margin-top:10px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:#1e2240;background:#fff;border:1px solid #e4e4ee;border-radius:10px;outline:none;transition:border-color .15s}
.ro-comment-input:focus{border-color:#9fb8e6}
.ro-comment-input::placeholder{color:#b8b8c8}
/* expanded */
.ro-expbar{height:4px;border-radius:2px;width:48px;margin-bottom:18px}
.ro-expname{font-family:'Fraunces',Georgia,serif;font-size:clamp(24px,4.5vw,36px);font-weight:900;line-height:1.1;margin-bottom:6px;color:#1e2240}
.ro-expmeta{color:#8a8aa0;font-size:12px;margin-bottom:16px;display:flex;gap:14px}
.ro-sec{font-size:9px;letter-spacing:3.5px;text-transform:uppercase;color:#b8b8c8;margin-bottom:11px;font-weight:600}
.ro-ings{list-style:none;margin-bottom:26px}
.ro-ings li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ededf5;font-size:13.5px;color:#1e2240}
.ro-ings li:last-child{border-bottom:none}
.ro-qty{color:#8a8aa0;font-size:12px;font-weight:500}
.ro-crit{display:inline-flex;align-items:center;background:#fdf0f0;color:#b84040;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;border:1px solid #e8b0b0;margin-left:7px}
.ro-warn{display:inline-flex;align-items:center;background:#fdf6e0;color:#b89030;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;border:1px solid #e8d080;margin-left:7px}
.ro-shop{background:#ecf8f4;border:1px solid #b0ddd4;border-radius:10px;padding:14px 16px;margin-bottom:22px}
.ro-shop .ro-sec{color:#2a7858;margin-bottom:8px}
.ro-shoplist{list-style:none}
.ro-shoplist li{font-size:13px;color:#1e4838;padding:6px 0;border-bottom:1px solid #c8e8d8;display:flex;align-items:center;gap:8px}
.ro-shoplist li:last-child{border-bottom:none}
.ro-shoplist li::before{content:'🛒';font-size:11px}
.ro-steps{list-style:none;counter-reset:rs;margin-bottom:26px}
.ro-steps li{counter-increment:rs;padding:13px 0 13px 50px;border-bottom:1px solid #ededf5;position:relative;font-size:13.5px;line-height:1.68;color:#4a4a68}
.ro-steps li:last-child{border-bottom:none}
.ro-steps li::before{content:counter(rs);position:absolute;left:0;top:13px;width:34px;height:34px;border-radius:50%;background:#fafaf8;border:1px solid #e4e4ee;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#8a8aa0}
.ro-tip{background:#fafaf8;border:1px solid #e4e4ee;border-left:3px solid #8ec4a8;border-radius:10px;padding:14px 16px;font-size:13px;color:#8a8aa0;line-height:1.7;margin-bottom:24px}
.ro-tip strong{color:#1e2240;display:block;margin-bottom:4px;font-size:9px;letter-spacing:2px;text-transform:uppercase}
/* loading / error in overlay */
.ro-loading{text-align:center;padding:60px 20px}
.ro-loading-label{font-size:12px;color:#8a8aa0;margin-bottom:20px;letter-spacing:.5px}
.ro-loadbar{height:3px;background:#e4e4ee;border-radius:2px;overflow:hidden;width:200px;margin:0 auto}
.ro-loadfill{height:100%;border-radius:2px;animation:rosweep 1.6s ease-in-out infinite;background:linear-gradient(90deg,#9fb8e6,#8ec4a8,#b8a0c8)}
@keyframes rosweep{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.ro-err{background:#fdf0f0;border:1px solid #e8b0b0;border-radius:12px;padding:20px;color:#b84040;font-size:13px;line-height:1.7;text-align:center}
#app{font-family:'Press Start 2P',monospace;width:100%;max-width:820px}
.title{font-size:21px;color:#4a3a2a;text-align:center;margin-bottom:14px;letter-spacing:2px}
.kitchen-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;align-items:end}
.fridge-outer{background:#dde4ec;border:3px solid #9aaab8;border-radius:10px 10px 5px 5px;box-shadow:inset -5px 0 0 #c2cdd8,inset 5px 0 0 #eef2f6}
.fridge-topbar{background:#c8d4de;height:11px;border-radius:8px 8px 0 0;border-bottom:2px solid #9aaab8;display:flex;align-items:center;justify-content:center}
.fridge-handle{width:28px;height:5px;background:#8a9ab0;border-radius:3px}
.fridge-inner{background:#e8f2ff;border:2px solid #c0d0e8;margin:5px;border-radius:4px;padding:5px;display:flex;flex-direction:column;gap:4px}
.fshelf{border-bottom:3px solid #a0b4cc;padding-bottom:5px;min-height:100px}
.fshelf:last-child{border-bottom:none}
.fshelf-lbl{font-size:12px;color:#7a90a8;letter-spacing:1px;margin-bottom:5px}
.fshelf-row{display:flex;flex-wrap:wrap;gap:4px;min-height:70px;align-content:flex-start}
.fridge-foot{background:#c8d4de;height:7px;border-radius:0 0 4px 4px}
.pantry-outer{background:#6b4a22;border:4px solid #3d2610;border-radius:5px 5px 2px 2px}
.pantry-topbar{background:#8a6030;height:13px;border-radius:2px 2px 0 0;border-bottom:3px solid #3d2610}
.pantry-inner{padding:5px;display:flex;flex-direction:column;gap:0}
.pshelf{background:#9a7040;border:2px solid #3d2610;border-bottom:4px solid #2a1a08;padding:5px 5px 4px;min-height:100px}
.pshelf:last-child{border-bottom:2px solid #3d2610}
.pshelf-lbl{font-size:12px;color:#d4a060;letter-spacing:1px;margin-bottom:5px}
.pshelf-row{display:flex;flex-wrap:wrap;gap:4px;min-height:70px;align-content:flex-start}
.pantry-foot{background:#3d2610;height:7px}
.item{width:52px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px;border:none;background:transparent;outline:2px solid transparent;border-radius:4px;animation:popin 0.28s cubic-bezier(.34,1.56,.64,1) both;touch-action:none;user-select:none}
@keyframes popin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.item:hover{outline-color:#ffffff44}
.item.hi{outline-color:#ffe87c}
.item.dragging{opacity:0.25;cursor:grabbing}
.item canvas{width:40px;height:40px;image-rendering:pixelated;display:block}
.item-lbl{font-size:6px;color:#e8e8e8;text-align:center;max-width:60px;line-height:1.5;word-break:break-word;white-space:normal;text-shadow:0 1px 3px #000,0 0 5px #000}
.fridge-inner .item-lbl{color:#1a3050;text-shadow:none}
.drop-zone-active{outline:2px dashed #ffe87c88!important}
#drag-ghost{position:fixed;pointer-events:none;z-index:99999;opacity:0.9;transform:scale(1.2)}
.tip{position:fixed;z-index:99999;background:#0a0a0a;border:2px solid #ffe87c;padding:10px 12px;font-family:'Press Start 2P',monospace;font-size:15px;color:#fff;pointer-events:auto;display:none;line-height:2.2;min-width:220px}
.tip-name{color:#ffe87c;font-size:18px;display:block;margin-bottom:6px}
.tip-loc{color:#8ab4ff;display:block}
.tip-date{color:#90ee90;display:block}
.smoke-canvas{position:fixed;top:0;left:0;pointer-events:none;z-index:99999;image-rendering:pixelated}
.input-area{border:2px solid #333;padding:12px;background:#111}
.irow{display:flex;gap:8px;align-items:stretch}
.ita{font-family:'Press Start 2P',monospace;font-size:16.5px;background:#0d0d0d;border:2px solid #333;color:#eee;padding:10px;flex:1;resize:none;height:56px;outline:none;line-height:1.9}
.ita:focus{border-color:#5b8cff}
.ibtn{font-family:'Press Start 2P',monospace;font-size:15px;background:#0d200d;border:2px solid #3a8a3a;color:#7ae87a;padding:0 16px;cursor:pointer}
.ibtn:hover{background:#3a8a3a;color:#fff}
.istat{font-size:13.5px;color:#3a5888;min-height:16px;margin-top:8px;line-height:2}
.ihint{font-size:12px;color:#444;margin-top:5px;line-height:2}
.ihint b{color:#c86060}
.dym-box{background:#1a1200;border:2px solid #ffe87c;padding:10px;margin-top:10px;display:none}
.dym-title{font-size:15px;color:#ffe87c;margin-bottom:8px}
.dym-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.dym-btn{font-family:'Press Start 2P',monospace;font-size:13.5px;padding:6px 10px;cursor:pointer;background:#1a2a1a;border:2px solid #4a8a4a;color:#8aea8a}
.dym-btn:hover{background:#4a8a4a;color:#fff}
.dym-skip{font-family:'Press Start 2P',monospace;font-size:13.5px;padding:6px 10px;cursor:pointer;background:#2a1a1a;border:2px solid #8a4a4a;color:#ea8a8a}
.tip-perishrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.tip-perishsel{font-family:'Press Start 2P',monospace;font-size:11px;background:#111;border:1px solid #444;color:#eee;padding:3px 5px;cursor:pointer}
.udot{position:absolute;top:1px;right:1px;width:7px;height:7px;border-radius:1px;pointer-events:none}
.udot-y{background:#ffe87c}
.udot-r{background:#ff4444;animation:blink .9s step-start infinite}
@keyframes blink{50%{opacity:0}}
.rbtn{font-family:'Press Start 2P',monospace;font-size:12px;background:#200d20;border:2px solid #8a3a8a;color:#d87ae8;padding:8px 14px;cursor:pointer;width:100%;margin-top:8px}
.rbtn:hover{background:#8a3a8a;color:#fff}
.rbtn:disabled{opacity:.5;cursor:wait}
/* Recipe panel */
#recipe-panel{font-family:'DM Sans',sans-serif}
.rp-loading{background:#111;border:2px solid #333;padding:20px;text-align:center;font-family:'Press Start 2P',monospace;font-size:6px;color:#555;letter-spacing:2px}
.rp-lbar{height:3px;background:#222;border-radius:2px;overflow:hidden;margin-top:10px}
.rp-lfill{height:100%;background:linear-gradient(90deg,#9fb8e6,#8ec4a8,#b8a0c8);animation:rpla 1.4s ease-in-out infinite}
@keyframes rpla{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
.rp-err{background:#2a0808;border:2px solid #6a2020;padding:14px;color:#e88080;font-size:11px;font-family:'Press Start 2P',monospace}
.rp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.rp-title{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#888;font-family:'Press Start 2P',monospace}
.rp-close{font-family:'Press Start 2P',monospace;font-size:9px;background:none;border:1px solid #333;color:#666;padding:5px 8px;cursor:pointer}
.rp-close:hover{color:#fff;border-color:#666}
.rpc{background:#1a1814;border:1px solid #2a2820;border-radius:10px;overflow:hidden;margin-bottom:10px;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.rpc:hover{transform:translateY(-2px)}
.rpc-bar{height:3px}
.rpc-body{padding:14px 16px 12px}
.rpc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.rpc-name{font-size:14px;font-weight:700;color:#f2ede6;line-height:1.3}
.rpc-badge{background:#2a3a5a;color:#9fb8e6;font-size:8px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.rpc-meta{font-size:11px;color:#7a7468;margin-bottom:8px}
.rpc-desc{font-size:12px;color:#9a9488;line-height:1.6;margin-bottom:10px}
.rpc-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.rpc-pill{font-size:9px;font-weight:600;padding:3px 8px;border-radius:20px}
.rpk{background:#2d2610;color:#b89a3a;border:1px solid #3d3410}
.rpp{background:#0f2220;color:#3a8e7a;border:1px solid #1a3830}
.rpc2{background:#1a1830;color:#7a68b8;border:1px solid #282650}
.rpf{background:#2d1a14;color:#b8607a;border:1px solid #3d2414}
.rpc-btn{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#9fb8e6;border:1px solid #2a3a5a;padding:5px 10px;border-radius:6px;background:#0d1a2e}
/* Expanded recipe */
.rpx-back{font-family:'Press Start 2P',monospace;font-size:7px;background:none;border:1px solid #333;color:#666;padding:6px 10px;cursor:pointer;margin-bottom:12px}
.rpx-back:hover{color:#fff;border-color:#666}
.rpx-name{font-size:16px;font-weight:700;color:#f2ede6;line-height:1.3;margin-bottom:4px}
.rpx-meta{font-size:11px;color:#7a7468;margin-bottom:14px}
.rpx-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}
.rpx-sec{font-size:7px;letter-spacing:3px;text-transform:uppercase;color:#555;margin-bottom:8px;font-family:'Press Start 2P',monospace}
.rpx-ings{list-style:none;margin-bottom:18px}
.rpx-ings li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #222;font-size:12px;color:#c8c2b8}
.rpx-ings li:last-child{border-bottom:none}
.rpx-qty{color:#666;font-size:11px}
.rpx-crit{background:#2a0808;color:#e84040;font-size:9px;padding:1px 6px;border-radius:8px;margin-left:5px}
.rpx-warn{background:#2a1a08;color:#b89030;font-size:9px;padding:1px 6px;border-radius:8px;margin-left:5px}
.rpx-steps{list-style:none;counter-reset:rs;margin-bottom:18px}
.rpx-steps li{counter-increment:rs;padding:10px 0 10px 38px;border-bottom:1px solid #222;position:relative;font-size:12px;line-height:1.65;color:#9a9488}
.rpx-steps li:last-child{border-bottom:none}
.rpx-steps li::before{content:counter(rs);position:absolute;left:0;top:10px;width:26px;height:26px;border-radius:50%;background:#1a1814;border:1px solid #2a2820;display:flex;align-items:center;justify-content:center;font-size:9px;color:#666}
.rpx-tip{background:#1a1814;border:1px solid #2a2820;border-left:2px solid #8ec4a8;border-radius:6px;padding:10px 12px;font-size:11px;color:#7a7468;line-height:1.65}
.rpx-tip strong{color:#c8c2b8;display:block;margin-bottom:3px;font-size:8px;letter-spacing:1.5px;text-transform:uppercase}
.rp-shuffle{width:100%;font-family:'Press Start 2P',monospace;font-size:7px;background:#111;border:1px solid #333;color:#666;padding:10px;cursor:pointer;margin-top:8px;letter-spacing:1px}
.rp-shuffle:hover:not(:disabled){background:#1a1814;color:#aaa;border-color:#555}
.rp-shuffle:disabled{opacity:.5;cursor:wait}
#loading-overlay{position:fixed;inset:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;gap:12px;font-family:'Press Start 2P',monospace;font-size:7px;color:#555;letter-spacing:2px;transition:opacity .4s}
#loading-bar{width:120px;height:4px;background:#222;border-radius:2px;overflow:hidden}
#loading-fill{height:100%;background:#5b8cff;border-radius:2px;animation:lpulse 1s ease-in-out infinite alternate}
@keyframes lpulse{from{width:15%}to{width:95%}}
</style>
</head>
<body>
<div id="recipe-overlay">
  <div class="ro-inner" id="ro-inner"></div>
</div>
<div id="loading-overlay">
  <div>LOADING KITCHEN...</div>
  <div id="loading-bar"><div id="loading-fill"></div></div>
</div>
<div id="app">
  <div class="title">&#9733; JESSIE'S DIGITAL KITCHEN &#9733;</div>
  <div class="kitchen-row">
    <div style="position:relative">      <div class="fridge-outer" style="position:relative;">
        <div class="fridge-topbar"><div class="fridge-handle"></div></div>
        <div class="fridge-inner">
          <div class="fshelf"><div class="fshelf-lbl">DAIRY &middot; EGGS &middot; DRINKS</div><div class="fshelf-row" id="f0"></div></div>
          <div class="fshelf"><div class="fshelf-lbl">PRODUCE &middot; HERBS</div><div class="fshelf-row" id="f1"></div></div>
          <div class="fshelf"><div class="fshelf-lbl">MEAT &middot; FISH</div><div class="fshelf-row" id="f2"></div></div>
        </div>
        <div class="fridge-foot"></div>
      </div>
    </div>
    <div>
      <div class="pantry-outer">
        <div class="pantry-topbar"></div>
        <div class="pantry-inner">
          <div class="pshelf"><div class="pshelf-lbl">GRAINS &middot; PASTA &middot; BREAD</div><div class="pshelf-row" id="p0"></div></div>
          <div class="pshelf"><div class="pshelf-lbl">CANS &middot; SAUCES &middot; OILS</div><div class="pshelf-row" id="p1"></div></div>
          <div class="pshelf"><div class="pshelf-lbl">SNACKS &middot; SPICES &middot; MISC</div><div class="pshelf-row" id="p2"></div></div>
        </div>
        <div class="pantry-foot"></div>
      </div>
    </div>

  if(/tomato.?puree|chopped.?tomato|tomato.?paste/.test(n))return SPR.can;
  if(/coconut.?milk|coconut.?cream/.test(n))return SPR.can;

  if(/sweet.?potato/.test(n))return SPR.carrot;
  if(/sour.?cream|creme.?fraiche|cream.?cheese/.test(n))return SPR.milk;
  if(/spring.?onion|red.?onion|white.?onion/.test(n))return SPR.spice;

  if(/cottage/.test(n))return SPR.cottage_cheese;

function drawCanvas(spr){
  const c=document.createElement('canvas');c.width=12;c.height=12;
  const ctx=c.getContext('2d');
  spr.p.forEach((row,r)=>row.forEach((v,col)=>{
    if(v===0)return;
    if(v===4){ctx.fillStyle=spr.c[3];}
    else if(v===5){ctx.fillStyle=spr._extra?spr._extra[0]:'#888888';}
    else{ctx.fillStyle=spr.c[v-1];}
    ctx.fillRect(col,r,1,1);
  }));
  return c;
}

function lev(a,b){
  const m=a.length,n=b.length,dp=[];
  for(let i=0;i<=m;i++){dp[i]=[i];for(let j=1;j<=n;j++)dp[i][j]=i===0?j:0;}
  for(let j=1;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function fuzzyMatch(input){
  const n=input.toLowerCase().trim();
  // Exact match or full phrase match only (not just first word)
  for(const f of KNOWN){if(n===f||n.includes(f)||f===n)return{match:n,confident:true};}
  if(pickSprite(n)!==SPR.misc)return{match:n,confident:true};
  let best=null,bestD=999;
  const words=n.split(/\s+/);
  for(const f of KNOWN){
    const fw=f.split(' ')[0];
    for(const w of words){
      if(w.length<3)continue;
      const d=lev(w,fw);
      if(d<bestD){bestD=d;best=f;}
    }
  }
  if(bestD<=1)return{match:n,confident:false,suggestion:best};
  return{match:n,confident:true,isBrand:true};
}

}

// days until yellow / red dot. null = never shown (shelf-stable)
const PDAYS={high:[4,7],medium:[8,14],low:null};
const CAT_P={produce:'high',herb:'high',meat:'high',fish:'high',dairy:'medium',egg:'medium',grain:'low',pasta:'low',flour:'low',bread:'medium',can:'low',sauce:'low',oil:'low',condiment:'low',spice:'low',snack:'low',misc:'low'};
function perishLevel(cat){return CAT_P[cat]||'low';}
function daysOld(ts){return(Date.now()-ts)/86400000;}
function urgencyClass(item){
  const lvl=item.perish||perishLevel(item.cat);
  const d=PDAYS[lvl];if(!d)return null;
  const age=daysOld(item.ts);
  if(age>=d[1])return'udot udot-r';
  if(age>=d[0])return'udot udot-y';
  return null;
}
// urgency score 0–1 for recipe sorting (not binary — uses continuous ratio)
function urgencyScore(item){
  const lvl=item.perish||perishLevel(item.cat);
  const d=PDAYS[lvl];if(!d)return 0;
  return Math.min(daysOld(item.ts)/d[1],1.5); // can exceed 1 if past red threshold
}

let dragItem=null,dragEl=null,dragGhost=null,dragMoved=false,dragOver=null;
const SHELF_IDS=['f0','f1','f2','p0','p1','p2'];

function dragStart(e,item,el){
  dragItem=item;dragEl=el;dragMoved=false;
  e.currentTarget.setPointerCapture(e.pointerId);

  // Build ghost from just the canvas sprite — no text, no cloneNode
  const srcCanvas=el.querySelector('canvas');
  dragGhost=document.createElement('canvas');
  dragGhost.id='drag-ghost';
  dragGhost.width=srcCanvas.width;
  dragGhost.height=srcCanvas.height;
  dragGhost.style.cssText='position:fixed;pointer-events:none;z-index:99998;width:44px;height:44px;image-rendering:pixelated;opacity:0.85;transform:scale(1.2)';
  dragGhost.getContext('2d').drawImage(srcCanvas,0,0);
  document.body.appendChild(dragGhost);
  movGhost(e.clientX,e.clientY);

  el.classList.add('dragging');
  tip.style.display='none';

  el.addEventListener('pointermove',onMove);
  el.addEventListener('pointerup',onUp);
  el.addEventListener('pointercancel',onUp);
}

function movGhost(x,y){
  if(!dragGhost)return;
  dragGhost.style.left=(x-22)+'px';
  dragGhost.style.top=(y-22)+'px';
}

function shelfUnder(x,y){
  for(const id of SHELF_IDS){
    const el=document.getElementById(id);
    if(!el)continue;
    const r=el.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return id;
  }
  return null;
}

function onMove(e){
  if(!dragItem)return;
  dragMoved=true;
  movGhost(e.clientX,e.clientY);
  const over=shelfUnder(e.clientX,e.clientY);
  if(over!==dragOver){
    if(dragOver)document.getElementById(dragOver)?.classList.remove('drop-zone-active');
    dragOver=over;
    if(dragOver)document.getElementById(dragOver)?.classList.add('drop-zone-active');
  }
}

function onUp(e){
  if(!dragItem)return;
  dragEl.removeEventListener('pointermove',onMove);
  dragEl.removeEventListener('pointerup',onUp);
  dragEl.removeEventListener('pointercancel',onUp);

  dragEl.classList.remove('dragging');
  if(dragGhost){dragGhost.remove();dragGhost=null;}
  if(dragOver)document.getElementById(dragOver)?.classList.remove('drop-zone-active');

  if(dragMoved&&dragOver){
    pushHistory();
    dragItem.zone=dragOver.startsWith('f')?'fridge':'pantry';
    dragItem.pinnedShelf=dragOver; // remember exact shelf
    save();
    renderAll();
  }

  dragItem=null;dragEl=null;dragOver=null;dragMoved=false;
}

function renderAll(){
  ['f0','f1','f2','p0','p1','p2'].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML='';});
  items.forEach(i=>placeItem(i,false));
}

function poof(id,el,rect){
  pushHistory();
  items=items.filter(i=>i.id!==id);
  save();
  el.remove();

  // Create a full-viewport canvas overlay
  const cvs=document.createElement('canvas');
  cvs.className='smoke-canvas';
  cvs.width=window.innerWidth;
  cvs.height=window.innerHeight;
  document.body.appendChild(cvs);
  const ctx=cvs.getContext('2d');

  // Centre of where the food was
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;

  // 8-bit pixel size
  const PX=4;

  // Spawn a grid of pixels that fly outward
  const COLS=['#ffffff','#dddddd','#aaaaaa','#888888','#cccccc','#eeeeee','#999999','#bbbbbb'];
  const particles=[];
  const count=48;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const spd=1.5+Math.random()*4;
    particles.push({
      x:cx+(Math.random()-0.5)*12,
      y:cy+(Math.random()-0.5)*12,
      vx:Math.cos(a)*spd,
      vy:Math.sin(a)*spd,
      col:COLS[Math.floor(Math.random()*COLS.length)],
      life:1,
      decay:0.03+Math.random()*0.04,
      size:PX*(1+Math.floor(Math.random()*3))
    });
  }

  function frame(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    let alive=false;
    for(const p of particles){
      if(p.life<=0)continue;
      alive=true;
      ctx.globalAlpha=p.life;
      ctx.fillStyle=p.col;
      // snap to pixel grid for 8-bit look
      const px=Math.round(p.x/PX)*PX;
      const py=Math.round(p.y/PX)*PX;
      ctx.fillRect(px,py,p.size,p.size);
      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=0.08; // slight gravity
      p.life-=p.decay;
    }
    if(alive){requestAnimationFrame(frame);}
    else{cvs.remove();}
  }
  requestAnimationFrame(frame);
}

function fmt(ts){
  const d=new Date(ts),mo=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
  return String(d.getDate()).padStart(2,'0')+' '+mo+' '+d.getFullYear();
}
function tsToInput(ts){
  const d=new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

  tip.style.display='block';

{"name":"Recipe Name","flag":"🇰🇷","time":"20 min","kcal":520,"pro":38,"carbs":48,"fat":16,"badge":true,"desc":"2-sentence card description","ings":[{"n":"ingredient","q":"quantity and prep","urgency":"none"}],"shop":[{"n":"store item","q":"amount"}],"steps":["Step 1","Step 2"],"tip":"One useful tip"}

Only badge:true on the top pick. urgency values: crit, warn, or none. shop must be present (empty array [] if grocery mode off).`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:3000,
        messages:[{role:'user',content:prompt}]
      })
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const text=data.content?.find(b=>b.type==='text')?.text||'';
    const match=text.match(/\[[\s\S]*\]/);
    if(!match)throw new Error('No JSON array found in response');
    // Sanitise: replace any unescaped apostrophes inside JSON strings before parsing
    const sanitised=sanitiseJSON(match[0]);
    const recipes=JSON.parse(sanitised);
    shownRecipes.push(...recipes.map(r=>r.name));
    renderRecipeCards(recipes,groceryMode);
  }catch(e){
    document.getElementById('ro-inner').innerHTML=`<button class="ro-backbtn" onclick="closeOverlay()"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M9.5 3L4.5 7.5 9.5 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Back to kitchen</button><div class="ro-err"><strong>Could not generate recipes.</strong><br><br>${e.message}</div>`;
  }
  btn.disabled=false;
}

function sanitiseJSON(str){
  // Walk the string character by character, track whether we're inside a JSON string value,
  // and replace unescaped apostrophes with a right-single-quotation-mark (valid in JSON strings).
  let out='';
  let inStr=false;
  let escaped=false;
  for(let i=0;i<str.length;i++){
    const ch=str[i];
    if(escaped){out+=ch;escaped=false;continue;}
    if(ch==='\\'){out+=ch;escaped=true;continue;}
    if(ch==='"'){inStr=!inStr;out+=ch;continue;}
    // Inside a string, swap apostrophe for the typographic equivalent (U+2019) which is valid
    if(inStr&&ch==="'"){out+='’';continue;}
    out+=ch;
  }
  return out;
}

function renderRecipeCards(recipes,groceryMode){
  openOverlay();
  const inner=document.getElementById('ro-inner');
  const crit=(recipes[0]?.ings||[]).filter(g=>g.urgency==='crit').map(g=>g.n.toLowerCase());
  const warn=(recipes[0]?.ings||[]).filter(g=>g.urgency==='warn').map(g=>g.n.toLowerCase());
  let title='Tonight\'s picks';
  if(crit.some(n=>n.includes('broc')))title='Broc it like it\'s hot';
  else if(crit.some(n=>n.includes('egg')))title='Egg-cellent timing';
  else if(crit.some(n=>n.includes('cucumber')||n.includes('cuke')))title='Cuke me up before you go';
  else if(crit.some(n=>n.includes('spinach')))title='Spinach me if you can';
  else if(crit.some(n=>n.includes('chicken')))title='No time to chicken out';
  else if(crit.some(n=>n.includes('salmon')||n.includes('fish')))title='Something fishy\'s going on';
  let sub='';
  if(crit.length)sub+=crit.slice(0,2).join(' and ')+' need using today. ';
  else if(warn.length)sub+=warn.slice(0,2).join(' and ')+' are getting on. ';
  sub+=groceryMode?'Grocery mode on — each recipe includes a short shopping list.':'Using only what\'s in your kitchen.';
  let html=`<button class="ro-backbtn" onclick="closeOverlay()"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M9.5 3L4.5 7.5 9.5 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Back to kitchen</button>
    <div class="ro-eyebrow">From your kitchen</div>
    <div class="ro-h1">${title}</div>
    <p class="ro-sub">${sub}</p>
    <div class="ro-cards">`;
  recipes.forEach((r,i)=>{
    const col=RECIPE_COLORS[i%3];
    html+=`<div class="ro-card" onclick="expandRecipe(${i})">
      <div class="ro-card-bar" style="background:${col}"></div>
      <div class="ro-card-body">
        <div class="ro-card-top"><div class="ro-name">${r.flag} ${r.name}</div>${r.badge?'<span class="ro-badge">⭐ Top Pick</span>':''}</div>
        <div class="ro-meta">⏱ ${r.time}${groceryMode&&r.shop&&r.shop.length?' &nbsp;·&nbsp; <span style="color:#2a7858;font-weight:600">🛒 '+r.shop.map(s=>s.n).join(', ')+'</span>':''}</div>
        <p class="ro-desc">${r.desc}</p>
        <div class="ro-pills">
          <span class="ro-pill ro-pk">~${r.kcal} kcal</span>
          <span class="ro-pill ro-pp">~${r.pro}g protein</span>
          <span class="ro-pill ro-pc">~${r.carbs}g carbs</span>
          <span class="ro-pill ro-pf">~${r.fat}g fat</span>
        </div>
        <div class="ro-viewbtn">View Recipe <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 6.5h8M6.5 2.5l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div></div>`;
  });
  html+=`</div>
    <button class="ro-shuffle" id="ro-shuffle-btn" onclick="shuffleRecipes()">🔀 Shuffle — generate new recipes</button>
    <input id="ro-shuffle-comment" class="ro-comment-input" placeholder="any preferences for the next round? (spicier, no eggs, under 500 kcal...)" autocomplete="off">
  `;
  inner.innerHTML=html;
  inner.dataset.recipes=JSON.stringify(recipes);
  inner.dataset.grocery=groceryMode?'1':'0';
  document.getElementById('recipe-overlay').scrollTop=0;
}

function expandRecipe(i){
  const inner=document.getElementById('ro-inner');
  const recipes=JSON.parse(inner.dataset.recipes||'[]');
  const groceryMode=inner.dataset.grocery==='1';
  const r=recipes[i];if(!r)return;
  const col=RECIPE_COLORS[i%3];
  const shopHtml=groceryMode&&r.shop&&r.shop.length?`<div class="ro-shop"><div class="ro-sec">🛒 Grab at the store</div><ul class="ro-shoplist">${r.shop.map(s=>`<li><span><strong>${s.n}</strong> — ${s.q}</span></li>`).join('')}</ul></div>`:'';
  inner.innerHTML=`
    <div style="display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap">
      <button class="ro-backbtn" style="margin-bottom:0" onclick="renderRecipeCards(JSON.parse(document.getElementById('ro-inner').dataset.recipes||'[]'),document.getElementById('ro-inner').dataset.grocery==='1')"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M9.5 3L4.5 7.5 9.5 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Back to recipes</button>
      <button class="ro-backbtn" style="margin-bottom:0" onclick="closeOverlay()"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M9.5 3L4.5 7.5 9.5 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Back to kitchen</button>
    </div>
    <div class="ro-expbar" style="background:${col}"></div>
    <div class="ro-expname">${r.flag} ${r.name}</div>
    <div class="ro-expmeta"><span>⏱ ${r.time}</span><span>· Per serving (estimated)</span></div>
    <div class="ro-pills" style="margin-bottom:26px">
      <span class="ro-pill ro-pk">~${r.kcal} kcal</span><span class="ro-pill ro-pp">~${r.pro}g protein</span><span class="ro-pill ro-pc">~${r.carbs}g carbs</span><span class="ro-pill ro-pf">~${r.fat}g fat</span>
    </div>
    <div class="ro-sec">From your kitchen</div>
    <ul class="ro-ings">${(r.ings||[]).map(g=>`<li><span>${g.n}${g.urgency==='crit'?'<span class="ro-crit">⚠️ use today</span>':g.urgency==='warn'?'<span class="ro-warn">⏳ getting old</span>':''}</span><span class="ro-qty">${g.q}</span></li>`).join('')}</ul>
    ${shopHtml}
    <div class="ro-sec">Method</div>
    <ol class="ro-steps">${(r.steps||[]).map(s=>`<li>${s}</li>`).join('')}</ol>
    ${r.tip?`<div class="ro-tip"><strong>✦ Tip</strong>${r.tip}</div>`:''}
  `;
  inner.dataset.recipes=JSON.stringify(recipes);
  inner.dataset.grocery=groceryMode?'1':'0';
  document.getElementById('recipe-overlay').scrollTop=0;
}

async function shuffleRecipes(){
  const btn=document.getElementById('ro-shuffle-btn');
  if(btn)btn.disabled=true;
  const shuffleComment=(document.getElementById('ro-shuffle-comment')?.value||'').trim();
  if(shuffleComment){
    // temporarily override the main comment field with the shuffle note
    const mainComment=document.getElementById('recipe-comment');
    const prev=mainComment?.value||'';
    if(mainComment)mainComment.value=shuffleComment;
    await suggestRecipes();
    if(mainComment)mainComment.value=prev;
  }else{
    await suggestRecipes();
  }
}

function closeRecipes(){closeOverlay();}

function makeItem(name,displayName,zone,cat){
  return{id:Date.now()+Math.random(),name,displayName,zone,cat,perish:perishLevel(cat),ts:Date.now()};
}

function handleAdd(){
  const raw=document.getElementById('inp').value.trim();
  if(!raw)return;
  const names=raw.split(/[\n,;]+/).map(s=>s.trim()).filter(s=>s.length>1);
  if(!names.length)return;
  const confident=[],needsDYM=[];
  names.forEach(name=>{
    const r=fuzzyMatch(name);
    if(r.confident)confident.push({name,displayName:r.match});
    else needsDYM.push({original:name,suggestion:r.suggestion});
  });
  const added=[];
  confident.forEach((c,i)=>{
    const{zone,cat}=classify(c.displayName);
    const item=makeItem(c.name,c.displayName,zone,cat);
    items.push(item);setTimeout(()=>placeItem(item,true),i*120);
    added.push({name:c.displayName,zone});
  });
  save();
  const fl=added.filter(a=>a.zone==='fridge').map(a=>a.name).join(', ');
  const pl=added.filter(a=>a.zone==='pantry').map(a=>a.name).join(', ');
  let msg='';if(fl)msg+='FRIDGE: '+fl+'  ';if(pl)msg+='PANTRY: '+pl;
  if(msg){document.getElementById('stat').textContent=msg;setTimeout(()=>document.getElementById('stat').textContent='',5000);}
  if(needsDYM.length>0)setTimeout(()=>showDYM(needsDYM),confident.length*120+100);
  document.getElementById('inp').value='';
}

function acceptDYM(idx,suggestion){
  const s=pendingDYM[idx];
  const{zone,cat}=classify(suggestion);
  const item=makeItem(s.original,suggestion,zone,cat);
  items.push(item);save();placeItem(item,true);
  pendingDYM.splice(idx,1);
  if(pendingDYM.length===0)document.getElementById('dym-box').style.display='none';
  else showDYM(pendingDYM);
}

function skipDYM(){
  pendingDYM.forEach(s=>{
    const{zone,cat}=classify(s.original);
    const item=makeItem(s.original,s.original,zone,cat);
    items.push(item);placeItem(item,true);
  });
  save();pendingDYM=[];document.getElementById('dym-box').style.display='none';
}

document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleAdd();}});

  await load();
  renderAll();
  const ov=document.getElementById('loading-overlay');
  ov.style.opacity='0';
  setTimeout(()=>ov.remove(),400);
})();
