<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf8">
<title>Jessie's Kitchen</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fraunces:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600;700&display=swap');

/* ── TOKENS ──────────────────────────────────────────────────────────── */
:root{
  --bg:#fafaf8; --card:#ffffff; --line:#e4e4ee; --ink:#1e2240;
  --muted:#8a8aa0; --faint:#b8b8c8; --body:#4a4a68;
  --blue:#9fb8e6; --blue-d:#3a5888; --green:#8ec4a8; --green-d:#2a7858;
  --purple:#b8a0c8; --amber:#b89030; --amber-bg:#fdf6e0; --amber-line:#e8d080;
  --red:#b84040; --red-bg:#fdf0f0; --red-line:#e8b0b0;
  --green-bg:#ecf8f4; --green-line:#b0ddd4;
  --r:14px; --shadow:0 2px 12px rgba(30,34,64,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
canvas.px{image-rendering:pixelated}

#app{max-width:640px;margin:0 auto;padding:20px 16px 96px}

/* ── HEADER ──────────────────────────────────────────────────────────── */
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.hdr-star{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--blue-d)}
.hdr h1{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:26px;line-height:1}
.hdr-sub{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}

/* ── TAB BAR ─────────────────────────────────────────────────────────── */
#tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
#tabbar .tb-inner{max-width:640px;margin:0 auto;display:flex}
.tab-btn{flex:1;background:none;border:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;position:relative;transition:color .15s}
.tab-btn.active{color:var(--ink)}
.tab-btn .ti{font-size:19px;line-height:1}
.tab-btn.active::after{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--blue),var(--green))}
.tab-badge{position:absolute;top:5px;right:calc(50% - 22px);background:var(--green-d);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ── SHARED ──────────────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--faint);font-weight:600;margin:22px 0 10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;transition:background .15s,border-color .15s}
.btn:hover{background:#f0f0f7;border-color:var(--blue)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:#343a63;border-color:#343a63}
.btn-danger{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}
.btn-danger:hover{background:#f8dede;border-color:var(--red)}
.btn-ghost{border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:8px}
.btn-ghost:hover{color:var(--ink)}
.chip{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chip-crit{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.chip-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line)}
.chip-ok{background:var(--green-bg);color:var(--green-d);border:1px solid var(--green-line)}

input.field,select.field,textarea.field{width:100%;padding:11px 13px;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;outline:none;transition:border-color .15s;appearance:none}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--blue)}
input.field::placeholder,textarea.field::placeholder{color:var(--faint)}
label.flbl{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:12px 0 5px;letter-spacing:.5px;text-transform:uppercase}

/* ── ADD BAR ─────────────────────────────────────────────────────────── */
.addbar{display:flex;gap:8px}
.addbar input{flex:1;min-width:0}
.dym{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dym-lbl{font-size:11px;color:var(--muted);font-weight:600;margin-right:2px}
.dym-chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--green-line);background:var(--green-bg);color:var(--green-d)}
.dym-chip:hover{background:#dcf2e8}
.dym-keep{border-color:var(--line);background:var(--card);color:var(--muted)}
.dym-keep:hover{color:var(--ink)}

/* ── USE IT UP STRIP ─────────────────────────────────────────────────── */
.useup{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.useup::-webkit-scrollbar{display:none}
.useup-card{flex:0 0 auto;width:108px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);border-top:3px solid var(--amber);cursor:pointer;transition:transform .15s}
.useup-card:hover{transform:translateY(-2px)}
.useup-card.crit{border-top-color:var(--red)}
.useup-name{font-size:12px;font-weight:600;text-align:center;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-transform:capitalize}

/* ── FILTERS ─────────────────────────────────────────────────────────── */
.filters{display:flex;gap:8px;margin:14px 0 4px;align-items:center;flex-wrap:wrap}
.filters input{flex:1;min-width:120px;padding:9px 12px;font-size:14px}
.pillrow{display:flex;gap:4px;background:#ededf3;border-radius:10px;padding:3px}
.pill{border:none;background:none;font-size:12px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:8px}
.pill.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(30,34,64,.12)}
select.sortsel{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;outline:none}

/* ── INVENTORY LIST ──────────────────────────────────────────────────── */
.group-hd{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--faint);font-weight:700;margin:18px 2px 8px}
.group-hd .cnt{background:#ededf3;color:var(--muted);border-radius:10px;font-size:10px;padding:2px 8px;letter-spacing:0}
.ilist{display:flex;flex-direction:column;gap:8px}
.irow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s;animation:rowin .25s ease both}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.irow:hover{border-color:var(--blue)}
.irow-mid{flex:1;min-width:0}
.irow-name{font-size:14.5px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
.irow-meta{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.done-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.done-btn:hover{background:var(--green-bg);border-color:var(--green);color:var(--green-d)}

.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:700;color:var(--ink);margin:12px 0 6px}
.empty p{font-size:13px;line-height:1.6}

/* ── FRIDGE VIEW ─────────────────────────────────────────────────────── */
.viewtoggle{display:flex;gap:4px;background:#ededf3;border-radius:10px;padding:3px;flex-shrink:0}
.viewtoggle button{border:none;background:none;font-size:12px;font-weight:600;color:var(--muted);padding:6px 13px;border-radius:8px}
.viewtoggle button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(30,34,64,.12)}
.kv{display:grid;grid-template-columns:1fr;gap:16px;margin-top:14px}
@media(min-width:560px){.kv{grid-template-columns:1fr 1fr;align-items:start}}
.appl{border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.appl-top{display:flex;align-items:center;gap:6px;padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.fridge .appl-top{background:#c8d4de;color:#5a7088}
.pantry .appl-top{background:#8a6030;color:#f2ddb8}
.appl-body{padding:8px}
.fridge .appl-body{background:#eaf3fb;border:2px solid #cddcec;border-top:none}
.pantry .appl-body{background:#7a5220;border:2px solid #3d2610;border-top:none}
.shelf{padding:6px 6px 10px}
.fridge .shelf{border-bottom:2px solid #cddcec}
.fridge .shelf:last-child{border-bottom:none}
.pantry .shelf{background:#976e3c;border:1px solid #3d2610;border-bottom:3px solid #2a1a08;border-radius:3px;margin-bottom:6px}
.pantry .shelf:last-child{margin-bottom:0}
.shelf-lbl{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.fridge .shelf-lbl{color:#7a90a8}
.pantry .shelf-lbl{color:#e6c896}
.shelf-row{display:flex;flex-wrap:wrap;gap:4px;min-height:58px;align-content:flex-start;border-radius:6px;transition:background .12s,outline-color .12s;outline:2px dashed transparent;outline-offset:-2px}
.shelf-row.drop{outline-color:var(--blue);background:rgba(159,184,230,.16)}
.shelf-empty{font-size:10px;font-weight:600;opacity:.5;padding:8px 4px;align-self:center}
.fridge .shelf-empty{color:#7a90a8}
.pantry .shelf-empty{color:#e6c896}
.fitem{width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:8px;cursor:grab;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;animation:popin .28s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.fitem:hover{background:rgba(255,255,255,.55)}
.pantry .fitem:hover{background:rgba(255,255,255,.14)}
.fitem.dragging{opacity:.3}
.fitem.dim{opacity:.2;filter:grayscale(.7)}
.fitem .ring{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.fitem .ring.warn{box-shadow:inset 0 0 0 2px var(--amber)}
.fitem .ring.crit{box-shadow:inset 0 0 0 2px var(--red);animation:ringpulse 1.1s ease-in-out infinite}
@keyframes ringpulse{50%{box-shadow:inset 0 0 0 2px var(--red),0 0 0 3px rgba(184,64,64,.3)}}
.fitem-lbl{font-size:9px;font-weight:600;text-align:center;line-height:1.15;max-width:58px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-transform:capitalize}
.fridge .fitem-lbl{color:#2a4058}
.pantry .fitem-lbl{color:#f4e8d0}
.fridge-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:12px}

/* ── BOTTOM SHEET ────────────────────────────────────────────────────── */
#backdrop{position:fixed;inset:0;background:rgba(30,34,64,.4);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#backdrop.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--card);border-radius:20px 20px 0 0;max-width:640px;margin:0 auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.32,.72,.32,1);max-height:88vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(30,34,64,.18)}
#sheet.on{transform:none}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet-title{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:900;margin-bottom:2px;text-transform:capitalize}
.sheet-sub{font-size:12px;color:var(--muted);margin-bottom:6px}
.sheet-row2{display:flex;gap:10px}
.sheet-row2>div{flex:1;min-width:0}
.sheet-actions{display:flex;gap:8px;margin-top:20px}
.sheet-actions .btn{flex:1;padding:12px}

/* ── TOAST ───────────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:76px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:11px 16px;border-radius:12px;z-index:100;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(30,34,64,.35)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;white-space:nowrap}

/* ── RECIPES ─────────────────────────────────────────────────────────── */
.prefcard{padding:14px 16px}
.prefcard summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:700}
.prefcard summary::-webkit-details-marker{display:none}
.prefcard summary .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
.prefcard[open] summary .chev{transform:rotate(180deg)}
.pref-summary-hint{font-size:11px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cuisines{display:flex;flex-wrap:wrap;gap:6px}
.ck{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.ck.on{background:#edf2fb;border-color:#c8d8f0;color:var(--blue-d)}
.togglerow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--body);margin-top:12px;cursor:pointer}
.togglerow input[type=checkbox]{width:16px;height:16px;accent-color:var(--green-d);cursor:pointer;flex-shrink:0}

.ro-cards{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.ro-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s;box-shadow:var(--shadow)}
.ro-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(30,34,64,.12)}
.ro-bar{height:4px}
.ro-body{padding:18px 20px 16px}
.ro-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.ro-name{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:700;line-height:1.2}
.ro-badge{background:#edf2fb;color:#4a6898;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:5px 10px;border-radius:20px;border:1px solid #c8d8f0;white-space:nowrap;flex-shrink:0;margin-top:3px}
.ro-meta{font-size:12px;color:var(--muted);margin:2px 0 8px}
.ro-desc{font-size:13.5px;color:#5a5a78;line-height:1.6;margin-bottom:12px}
.ro-pills{display:flex;gap:6px;flex-wrap:wrap}
.ro-pill{font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px}
.ro-pk{background:#fdf8ec;color:#b89a3a;border:1px solid #ede0b0}
.ro-pp{background:var(--green-bg);color:#3a8e7a;border:1px solid var(--green-line)}
.ro-pc{background:#f4f2fc;color:#7a68b8;border:1px solid #ccc8e8}
.ro-pf{background:#fcf0f3;color:#b8607a;border:1px solid #e8c0cc}
.ro-h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(26px,5vw,38px);font-weight:900;line-height:1.1;margin-bottom:8px}
.ro-sub{color:var(--muted);font-size:13.5px;font-weight:300;line-height:1.65;margin-bottom:8px}
.ro-loading{text-align:center;padding:52px 20px}
.ro-loading-label{font-size:13px;color:var(--muted);margin-bottom:18px}
.ro-loadbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;width:200px;margin:0 auto}
.ro-loadfill{height:100%;border-radius:2px;animation:sweep 1.6s ease-in-out infinite;background:linear-gradient(90deg,var(--blue),var(--green),var(--purple))}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.ro-err{background:var(--red-bg);border:1px solid var(--red-line);border-radius:12px;padding:18px;color:var(--red);font-size:13px;line-height:1.65;margin-top:16px}
.ro-ings{list-style:none;margin-bottom:6px}
.ro-ings li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ededf5;font-size:13.5px}
.ro-ings li:last-child{border-bottom:none}
.ro-qty{color:var(--muted);font-size:12px;font-weight:500;text-align:right;flex-shrink:0}
.ro-steps{list-style:none;counter-reset:rs;margin-bottom:8px}
.ro-steps li{counter-increment:rs;padding:12px 0 12px 46px;border-bottom:1px solid #ededf5;position:relative;font-size:13.5px;line-height:1.65;color:var(--body)}
.ro-steps li:last-child{border-bottom:none}
.ro-steps li::before{content:counter(rs);position:absolute;left:0;top:12px;width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted)}
.ro-tip{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;padding:13px 15px;font-size:13px;color:var(--muted);line-height:1.65;margin-top:16px}
.ro-tip strong{color:var(--ink);display:block;margin-bottom:3px;font-size:9px;letter-spacing:2px;text-transform:uppercase}
.ro-shop{background:var(--green-bg);border:1px solid var(--green-line);border-radius:10px;padding:13px 15px;margin:14px 0}
.ro-shop-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ro-shop .sec-label{margin:0;color:var(--green-d)}
.ro-shoplist{list-style:none}
.ro-shoplist li{font-size:13px;color:#1e4838;padding:5px 0;display:flex;gap:8px}
.ro-shoplist li::before{content:'🛒';font-size:11px}
.detail-actions{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.detail-actions .btn{flex:1;min-width:120px;padding:12px 10px;font-size:12.5px}
.cookbook-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.cookbook-row:hover{border-color:var(--blue)}
.cb-flag{font-size:20px}
.cb-mid{flex:1;min-width:0}
.cb-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-meta{font-size:11px;color:var(--muted)}

/* ── COOK MODE ───────────────────────────────────────────────────────── */
#cookmode{position:fixed;inset:0;background:var(--bg);z-index:120;display:none;overflow-y:auto}
#cookmode.on{display:block}
.cm-inner{max-width:640px;margin:0 auto;padding:20px 20px 60px}
.cm-steps{list-style:none;margin-top:10px}
.cm-step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #ededf5;cursor:pointer}
.cm-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:all .15s;margin-top:2px}
.cm-step.done .cm-check{background:var(--green-d);border-color:var(--green-d)}
.cm-text{font-size:16.5px;line-height:1.65;color:var(--ink)}
.cm-step.done .cm-text{color:var(--faint);text-decoration:line-through}
.cm-ing-note{font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.7;margin-top:14px}

/* ── SHOPPING ────────────────────────────────────────────────────────── */
.shoprow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.shoprow input[type=checkbox]{width:20px;height:20px;accent-color:var(--green-d);cursor:pointer;flex-shrink:0}
.shop-name{flex:1;font-size:14.5px;font-weight:500;text-transform:capitalize;min-width:0;overflow:hidden;text-overflow:ellipsis}
.shoprow.done .shop-name{color:var(--faint);text-decoration:line-through}
.shop-qty{font-size:12px;color:var(--muted);flex-shrink:0}
.shop-from{font-size:10px;color:var(--blue-d);background:#edf2fb;border-radius:10px;padding:2px 8px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.shop-x{border:none;background:none;color:var(--faint);font-size:16px;padding:4px}
.shop-x:hover{color:var(--red)}

/* ── DATA ROW / POOF ─────────────────────────────────────────────────── */
.datarow{display:flex;gap:8px;justify-content:center;margin-top:26px}
.smoke-canvas{position:fixed;top:0;left:0;pointer-events:none;z-index:200}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Sprite picker: compound phrases before single words. */
function pickSprite(name){
  const n=name.toLowerCase();
  if(/pasta.?sauce|marinara|arrabiata|bolognese|tomato.?sauce|passata/.test(n))return SPRITES.sauce;
  if(/fish.?sauce|oyster.?sauce|soy.?sauce|hot.?sauce|chilli.?sauce|bbq.?sauce|worcestershire|hoisin|teriyaki|sriracha|tabasco/.test(n))return SPRITES.sauce;
  if(/tomato.?puree|chopped.?tomato|tomato.?paste/.test(n))return SPRITES.can;
  if(/coconut.?milk|coconut.?cream/.test(n))return SPRITES.can;
  if(/peanut.?butter|almond.?butter/.test(n))return SPRITES.snack;
  if(/olive.?oil|vegetable.?oil|coconut.?oil|sesame.?oil|sunflower.?oil|rapeseed.?oil/.test(n))return SPRITES.oil;
  if(/sweet.?potato/.test(n))return SPRITES.carrot;
  if(/sour.?cream|creme.?fraiche|cream.?cheese/.test(n))return SPRITES.milk;
  if(/spring.?onion|red.?onion|white.?onion/.test(n))return SPRITES.spice;
  if(/green.?bean|runner.?bean/.test(n))return SPRITES.carrot;
  if(/baking.?powder|baking.?soda/.test(n))return SPRITES.rice;
  if(/maple.?syrup|brown.?sugar/.test(n))return SPRITES.spice;
  if(/mixed.?spice|chilli.?flake|ginger.?powder|coriander.?seed/.test(n))return SPRITES.spice;
  if(/sea.?bass|sea.?bream/.test(n))return SPRITES.fish;
  if(/cottage/.test(n))return SPRITES.cottage_cheese;
  if(/yogurt|yoghurt/.test(n))return SPRITES.yogurt;
  if(/kefir/.test(n))return SPRITES.kefir;
  if(/\bmilk\b|cream/.test(n))return SPRITES.milk;
  if(/cheese|brie|gouda|feta|mozz|parmes|ricott|halloum|cheddar/.test(n))return SPRITES.cheese;
  if(/\bbutter\b/.test(n))return SPRITES.oil;

function drawCanvas(spr){
  const c=document.createElement('canvas');c.width=12;c.height=12;c.className='px';
  const ctx=c.getContext('2d');
  spr.p.forEach((row,r)=>row.forEach((v,col)=>{
    if(v===0)return;
    if(v===4)ctx.fillStyle=spr.c[3];
    else if(v===5)ctx.fillStyle=spr._extra?spr._extra[0]:'#888888';
    else ctx.fillStyle=spr.c[v-1];
    ctx.fillRect(col,r,1,1);
  }));
  return c;
}

  {r:/\bnut|almond|cashew|walnut|pecan|pistachio|hazelnut|peanut/i,z:'pantry',c:'snack'},
  {r:/chip|crisp|popcorn|pretzel|biscuit|cookie/i,z:'pantry',c:'snack'},
  {r:/coffee|espresso|\btea\b|chai|matcha/i,z:'pantry',c:'misc'},
  {r:/garlic|onion|shallot/i,z:'pantry',c:'misc'},
  {r:/potato|yam/i,z:'pantry',c:'misc'},
];
function classify(name){for(const r of RULES){if(r.r.test(name))return{zone:r.z,cat:r.c};}return{zone:'pantry',cat:'misc'};}

const KNOWN=['yogurt','kefir','milk','cream','cheese','butter','egg','eggs','salmon','tuna','cod','fish','chicken','beef','veal','pork','lamb','steak','mince','bacon','ham','tofu','tempeh','broccoli','carrot','tomato','spinach','kale','lettuce','pepper','cucumber','zucchini','courgette','cauliflower','cabbage','asparagus','leek','fennel','celery','beetroot','apple','pear','lemon','lime','orange','mango','grapes','strawberry','blueberry','raspberry','peach','banana','kiwi','watermelon','grape','dates','date','fig','figs','raisin','raisins','prune','prunes','apricot','dried mango','dried fruit','rice','quinoa','pasta','spaghetti','penne','lentils','chickpeas','oats','couscous','barley','flour','bread','pita','wrap','tortilla','cracker','olive oil','sesame oil','sunflower oil','vinegar','balsamic','soy sauce','sriracha','ketchup','mustard','mayonnaise','hot sauce','tomato sauce','passata','coconut milk','stock','broth','canned tomatoes','salt','paprika','cumin','turmeric','cinnamon','cardamom','oregano','basil','parsley','coriander','dill','mint','thyme','rosemary','ginger','garlic','onion','chocolate','peanut butter','almond butter','tahini','almonds','cashews','walnuts','honey','maple syrup','sugar','coffee','tea','matcha','wine','white wine','red wine','rosé','beer','cider','sake','spirits','gin','vodka','whisky','shallot','potato','sweet potato'];

function levenshtein(a,b){
  const m=a.length,n=b.length,dp=[];
  for(let i=0;i<=m;i++){dp[i]=[i];for(let j=1;j<=n;j++)dp[i][j]=i===0?j:0;}
  for(let j=1;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function fuzzyMatch(input){
  const n=input.toLowerCase().trim();
  for(const f of KNOWN){if(n===f||n.includes(f))return{match:n,confident:true};}
  if(pickSprite(n)!==SPRITES.misc)return{match:n,confident:true};
  let best=null,bestD=999;
  const words=n.split(/\s+/);
  for(const f of KNOWN){
    const fw=f.split(' ')[0];
    for(const w of words){
      if(w.length<3)continue;
      const d=levenshtein(w,fw);
      if(d<bestD){bestD=d;best=f;}
    }
  }
  if(bestD<=1)return{match:n,confident:false,suggestion:best};
  return{match:n,confident:true};
}

/* ════════════════════════════════════════════════════════════════════════
   PERISHABILITY
   ════════════════════════════════════════════════════════════════════════ */
const PDAYS={high:[4,7],medium:[8,14],low:null};
const CAT_P={produce:'high',herb:'high',meat:'high',fish:'high',dairy:'medium',egg:'medium',drink:'medium',grain:'low',pasta:'low',flour:'low',bread:'medium',can:'low',sauce:'low',oil:'low',condiment:'low',spice:'low',snack:'low',misc:'low'};
const CATEGORIES=Object.keys(CAT_P);
function perishLevel(cat){return CAT_P[cat]||'low';}
function daysOld(ts){return(Date.now()-ts)/86400000;}
function urgencyScore(item){
  const lvl=item.perish||perishLevel(item.cat);
  const d=PDAYS[lvl];if(!d)return 0;
  return Math.min(daysOld(item.ts)/d[1],1.5);
}
function freshInfo(item){
  const lvl=item.perish||perishLevel(item.cat);
  const d=PDAYS[lvl];if(!d)return null;
  const age=daysOld(item.ts);
  if(age>=d[1])return{cls:'chip-crit',txt:'use today',crit:true};
  if(age>=d[0])return{cls:'chip-warn',txt:'use in '+Math.max(1,Math.ceil(d[1]-age))+'d',crit:false};
  return null;
}
function ageLabel(ts){
  const d=Math.floor(daysOld(ts));
  if(d<=0)return'today';
  if(d===1)return'1 day ago';
  return d+' days ago';
}

const LS_KEY='jk-state-v2';
let state={items:[],shopping:[],cookbook:[],viewMode:'list',prefs:{cuisines:['Korean','Thai','Lebanese','Greek'],spice:'medium',protein:'30-45g',diet:'',airfryer:true,grocery:false}};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const json=JSON.stringify(state);
    try{localStorage.setItem(LS_KEY,json);}catch(e){}
    if(window.storage){window.storage.set(LS_KEY,json).catch(()=>{});}
  },150);
}

async function load(){
  let raw=null;
  try{raw=localStorage.getItem(LS_KEY);}catch(e){}
  if(!raw&&window.storage){
    try{const r=await window.storage.get(LS_KEY);if(r&&r.value)raw=r.value;}catch(e){}
  }
  if(raw){
    try{const d=JSON.parse(raw);state={...state,...d,prefs:{...state.prefs,...(d.prefs||{})}};return;}catch(e){}
  }
  let old=null;
  try{old=localStorage.getItem('kitchen-items');}catch(e){}
  if(!old&&window.storage){
    try{const r=await window.storage.get('kitchen-items');if(r&&r.value)old=r.value;}catch(e){}
  }
  if(old){
    try{
      const items=JSON.parse(old);
      if(Array.isArray(items)){state.items=items.map(i=>({...i,id:String(i.id||uid()),qty:i.qty||''}));save();}
    }catch(e){}
  }
}

/* ── UNDO ────────────────────────────────────────────────────────────── */
const undoHistory=[];
function snapshot(){
  undoHistory.push(JSON.stringify({items:state.items,shopping:state.shopping,cookbook:state.cookbook}));
  if(undoHistory.length>25)undoHistory.shift();
}
function undo(){
  if(!undoHistory.length)return;
  const s=JSON.parse(undoHistory.pop());
  state.items=s.items;state.shopping=s.shopping;state.cookbook=s.cookbook;
  save();render();
  toast('Undone');
}

/* ── POOF (kept — deleting things should stay fun) ───────────────────── */
function poofAt(x,y){
  const cvs=document.createElement('canvas');
  cvs.className='smoke-canvas';cvs.width=innerWidth;cvs.height=innerHeight;
  document.body.appendChild(cvs);
  const ctx=cvs.getContext('2d'),PX=4;
  const COLS=['#ffffff','#dddddd','#aaaaaa','#888888','#cccccc','#eeeeee'];
  const parts=[];
  for(let i=0;i<40;i++){
    const a=Math.random()*Math.PI*2,spd=1.5+Math.random()*4;
    parts.push({x:x+(Math.random()-.5)*10,y:y+(Math.random()-.5)*10,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,col:COLS[Math.floor(Math.random()*COLS.length)],life:1,decay:.03+Math.random()*.04,size:PX*(1+Math.floor(Math.random()*3))});
  }
  (function frame(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    let alive=false;
    for(const p of parts){
      if(p.life<=0)continue;alive=true;
      ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
      ctx.fillRect(Math.round(p.x/PX)*PX,Math.round(p.y/PX)*PX,p.size,p.size);
      p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=p.decay;
    }
    if(alive)requestAnimationFrame(frame);else cvs.remove();
  })();
}

/* ── FRIDGE VIEW ─────────────────────────────────────────────────────────
   Items sit on category shelves as their pixel sprites. Tap opens the same
   edit sheet; drag a sprite onto another shelf to re-file it (pins the shelf
   and updates its fridge/pantry zone). Freshness reads as a ring: amber for
   "use soon", pulsing red for "use today".
   ──────────────────────────────────────────────────────────────────────── */
const FRIDGE_SHELVES=[
  {id:'f0',lbl:'Dairy · Eggs · Drinks',cats:['dairy','egg','drink']},
  {id:'f1',lbl:'Produce · Herbs',cats:['produce','herb']},
  {id:'f2',lbl:'Meat · Fish',cats:['meat','fish']},
];
const PANTRY_SHELVES=[
  {id:'p0',lbl:'Grains · Pasta · Bread',cats:['grain','pasta','flour','bread']},
  {id:'p1',lbl:'Cans · Sauces · Oils',cats:['can','sauce','oil','condiment']},
  {id:'p2',lbl:'Snacks · Spices · Misc',cats:['spice','snack','misc']},
];
function shelfFor(it){
  const shelves=it.zone==='fridge'?FRIDGE_SHELVES:PANTRY_SHELVES;
  if(it.pinnedShelf&&shelves.some(s=>s.id===it.pinnedShelf))return it.pinnedShelf;
  for(const s of shelves)if(s.cats.includes(it.cat))return s.id;
  return shelves[shelves.length-1].id;
}
function fridgeHTML(){
  const q=searchQ.trim().toLowerCase();
  const appliance=(cls,title,shelves,zone)=>{
    let sh='';
    for(const s of shelves){
      const items=state.items.filter(i=>i.zone===zone&&shelfFor(i)===s.id);
      sh+=`<div class="shelf"><div class="shelf-lbl">${s.lbl}</div><div class="shelf-row" data-shelf="${s.id}">`;
      if(!items.length)sh+=`<div class="shelf-empty">empty</div>`;
      for(const it of items){
        const f=freshInfo(it);
        const dn=it.displayName||it.name;
        const dim=q&&!(dn.toLowerCase().includes(q)||it.cat.includes(q))?' dim':'';
        sh+=`<div class="fitem${dim}" data-id="${it.id}" title="${esc(dn)}">
          <div class="ring${f?f.crit?' crit':' warn':''}"><span data-sprite="${esc(dn)}" data-size="40px"></span></div>
          <div class="fitem-lbl">${esc(dn)}</div></div>`;
      }
      sh+=`</div></div>`;
    }
    return`<div class="appl ${cls}"><div class="appl-top">${title}</div><div class="appl-body">${sh}</div></div>`;
  };
  return`<div class="kv">
    ${appliance('fridge','🧊 Fridge',FRIDGE_SHELVES,'fridge')}
    ${appliance('pantry','🥫 Pantry',PANTRY_SHELVES,'pantry')}
  </div>
  <div class="fridge-hint">Tap an item to edit · drag it to another shelf to move it</div>`;
}

/* Drag-to-refile + tap-to-edit on shelves (pointer events → works on touch). */
let fdrag=null;
function initFridgeDrag(){
  document.addEventListener('pointerdown',e=>{
    if(currentTab!=='kitchen'||state.viewMode!=='fridge')return;
    const el=e.target.closest&&e.target.closest('.fitem');
    if(!el)return;
    fdrag={id:el.dataset.id,el,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,overRow:null};
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    el.addEventListener('pointermove',onFMove);
    el.addEventListener('pointerup',onFUp);
    el.addEventListener('pointercancel',onFUp);
  });
}
function onFMove(e){
  if(!fdrag)return;
  if(!fdrag.moved&&Math.hypot(e.clientX-fdrag.x0,e.clientY-fdrag.y0)<8)return;
  if(!fdrag.moved){
    fdrag.moved=true;
    fdrag.el.classList.add('dragging');
    const cv=fdrag.el.querySelector('canvas');
    if(cv){
      const g=document.createElement('canvas');g.width=cv.width;g.height=cv.height;g.className='px';
      g.style.cssText='position:fixed;z-index:210;width:46px;height:46px;pointer-events:none;image-rendering:pixelated;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 10px rgba(30,34,64,.35))';
      g.getContext('2d').drawImage(cv,0,0);
      document.body.appendChild(g);fdrag.ghost=g;
    }
  }
  if(fdrag.ghost){fdrag.ghost.style.left=e.clientX+'px';fdrag.ghost.style.top=e.clientY+'px';}
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const row=under&&under.closest?under.closest('.shelf-row'):null;
  if(row!==fdrag.overRow){
    if(fdrag.overRow)fdrag.overRow.classList.remove('drop');
    fdrag.overRow=row;
    if(row)row.classList.add('drop');
  }
}
function onFUp(){
  if(!fdrag)return;
  const el=fdrag.el;
  el.removeEventListener('pointermove',onFMove);
  el.removeEventListener('pointerup',onFUp);
  el.removeEventListener('pointercancel',onFUp);
  if(fdrag.ghost)fdrag.ghost.remove();
  if(fdrag.overRow)fdrag.overRow.classList.remove('drop');
  const moved=fdrag.moved,id=fdrag.id,row=fdrag.overRow;
  fdrag=null;
  if(!moved){openItemSheet(id);return;}
  if(row){
    const shelfId=row.dataset.shelf;
    const it=state.items.find(i=>i.id===id);
    if(it&&shelfId&&shelfFor(it)!==shelfId){
      snapshot();
      it.zone=shelfId[0]==='f'?'fridge':'pantry';
      it.pinnedShelf=shelfId;
      save();render();
      toast(`Moved ${it.displayName||it.name}`,{undo});
      return;
    }
  }
  el.classList.remove('dragging');
}

function filteredItems(){
  let list=[...state.items];
  if(locFilter!=='all')list=list.filter(i=>i.zone===locFilter);
  if(searchQ.trim()){
    const q=searchQ.trim().toLowerCase();
    list=list.filter(i=>(i.displayName||i.name).toLowerCase().includes(q)||i.cat.includes(q));
  }
  if(sortMode==='fresh')list.sort((a,b)=>urgencyScore(b)-urgencyScore(a)||a.ts-b.ts);
  else if(sortMode==='new')list.sort((a,b)=>b.ts-a.ts);
  else list.sort((a,b)=>(a.displayName||a.name).localeCompare(b.displayName||b.name));
  return list;
}

function rowHTML(it){

function listHTML(){
  if(!state.items.length){
    return`<div class="empty">
      <span data-sprite="broccoli" data-size="56px"></span>
      <div class="big">Your kitchen is empty</div>

/* ── ADD FLOW ────────────────────────────────────────────────────────── */
function dymHTML(){
  if(!pendingDYM.length)return'';
  let h='<div class="dym"><span class="dym-lbl">Did you mean:</span>';
  pendingDYM.forEach((s,i)=>{
    h+=`<button class="dym-chip" onclick="acceptDYM(${i})">${esc(s.original)} → ${esc(s.suggestion)}?</button>`;
  });
  h+=`<button class="dym-chip dym-keep" onclick="skipDYM()">keep as typed</button></div>`;
  return h;
}

function makeItem(name,displayName,zone,cat){
  return{id:uid(),name,displayName,zone,cat,perish:perishLevel(cat),ts:Date.now(),qty:''};
}

function handleAdd(){
  const inp=document.getElementById('add-inp');
  const raw=(inp?.value||'').trim();
  if(!raw)return;
  if(tryImportText(raw)){inp.value='';return;}
  const names=raw.split(/[\n,;]+/).map(s=>s.trim()).filter(s=>s.length>1);
  if(!names.length)return;
  snapshot();
  const added=[];
  names.forEach(name=>{
    const r=fuzzyMatch(name);
    if(r.confident){
      const{zone,cat}=classify(r.match);
      state.items.push(makeItem(name,r.match,zone,cat));
      added.push(r.match);
    }else{
      pendingDYM.push({original:name,suggestion:r.suggestion});
    }
  });
  save();
  inp.value='';
  render();
  if(added.length)toast(`Added ${added.length===1?added[0]:added.length+' items'}`,{undo});
}
function acceptDYM(i){
  const s=pendingDYM.splice(i,1)[0];
  const{zone,cat}=classify(s.suggestion);
  snapshot();
  state.items.push(makeItem(s.original,s.suggestion,zone,cat));
  save();render();
  toast('Added '+s.suggestion,{undo});
}
function skipDYM(){
  snapshot();
  const n=pendingDYM.length;
  pendingDYM.forEach(s=>{
    const{zone,cat}=classify(s.original);
    state.items.push(makeItem(s.original,s.original,zone,cat));
  });
  pendingDYM=[];
  save();render();
  toast(`Added ${n} item${n===1?'':'s'} as typed`,{undo});
}

function removeItem(id){

/* ── EXPORT / IMPORT ─────────────────────────────────────────────────── */
function exportData(){
  const json=JSON.stringify(state,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='jessies-kitchen-'+tsToInput(Date.now())+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  if(navigator.clipboard)navigator.clipboard.writeText(json).catch(()=>{});
  toast('Exported — file downloaded');
}
function importFile(inp){
  const f=inp.files&&inp.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{if(!tryImportText(String(rd.result)))toast('Could not read that file');};
  rd.readAsText(f);
  inp.value='';
}
function tryImportText(raw){
  raw=raw.trim();
  if(!raw.startsWith('[')&&!raw.startsWith('{'))return false;
  try{
    const data=JSON.parse(raw);
    if(Array.isArray(data)){ // original pixel-kitchen export format
      if(!data.every(i=>i&&i.name&&i.zone&&i.cat&&i.ts))return false;
      snapshot();
      state.items=data.map(i=>({...i,id:String(i.id||uid()),qty:i.qty||''}));
    }else if(data.items){
      snapshot();
      state={...state,...data,prefs:{...state.prefs,...(data.prefs||{})}};
    }else return false;
    save();render();
    toast(`Imported ${state.items.length} items`,{undo});
    return true;
  }catch(e){return false;}
}

/* ── RECIPE GENERATION — Anthropic API with structured output ────────── */
const RECIPE_SCHEMA={
  type:'object',additionalProperties:false,required:['headline','recipes'],
  properties:{
    headline:{type:'string',description:'Short playful title for this set of picks, max 6 words'},
    recipes:{type:'array',items:{
      type:'object',additionalProperties:false,
      required:['name','flag','time','kcal','pro','carbs','fat','badge','desc','ings','shop','steps','tip'],
      properties:{
        name:{type:'string'},
        flag:{type:'string',description:'One flag emoji for the cuisine'},
        time:{type:'string',description:'e.g. 20 min'},
        kcal:{type:'integer'},pro:{type:'integer'},carbs:{type:'integer'},fat:{type:'integer'},
        badge:{type:'boolean',description:'true only on the single top pick'},
        desc:{type:'string',description:'Two appetising sentences for the card'},
        ings:{type:'array',items:{type:'object',additionalProperties:false,required:['n','q','urgency'],
          properties:{n:{type:'string'},q:{type:'string',description:'quantity and prep'},urgency:{type:'string',enum:['crit','warn','none']}}}},
        shop:{type:'array',description:'Store items to buy; empty when grocery mode is off',
          items:{type:'object',additionalProperties:false,required:['n','q'],properties:{n:{type:'string'},q:{type:'string'}}}},
        steps:{type:'array',items:{type:'string'}},
        tip:{type:'string'}
      }
    }}
  }
};

function buildRecipePrompt(request,grocery){
  const p=state.prefs;
  const sorted=[...state.items].sort((a,b)=>urgencyScore(b)-urgencyScore(a));
  const inv=sorted.map(it=>{
    const dn=it.displayName||it.name;
    const f=freshInfo(it);
    const lvl=it.perish||perishLevel(it.cat);
    const qty=it.qty?` (${it.qty})`:'';
    if(lvl==='low')return`${dn}${qty} (shelf-stable)`;
    return`${dn}${qty} (${daysOld(it.ts).toFixed(0)}d old${f?f.crit?' — USE TODAY':' — getting old':''})`;
  }).join('\n');
  const excl=shownRecipeNames.length?`\nDo NOT repeat these already-shown recipes: ${shownRecipeNames.join(', ')}.`:'';
  return`You are the recipe engine for Jessie's kitchen app.

About Jessie: loves bold international flavors — especially ${p.cuisines.join(', ')||'anything interesting'}. Spice preference: ${p.spice}. Targets ${p.protein||'30-45g'} protein per meal. ${p.airfryer?'Has an air fryer and likes using it.':''} ${p.diet?'Dietary notes: '+p.diet+'.':''} Wants meals under 30 minutes active time with at most 6 active ingredients. Make the food sound genuinely delicious.

Current kitchen inventory (prioritise older and more perishable items):
${inv}
${excl}
${request?'\nTonight\'s request: '+request:''}
${grocery?'\nGrocery mode ON: you may include a few extra store-bought ingredients per recipe; list them in the shop array.':'\nGrocery mode OFF: use ONLY the inventory above. Every recipe\'s shop array must be empty.'}

Return exactly 3 recipes. Mark badge true on exactly one (the top pick). For each inventory ingredient used, set urgency to crit if flagged USE TODAY, warn if getting old, otherwise none.`;
}

async function suggestRecipes(shuffle){
  if(!state.items.length){toast('Add some items to your kitchen first');return;}
  const req=(document.getElementById('recipe-req')?.value||'').trim();
  const grocery=state.prefs.grocery;
  if(!shuffle)shownRecipeNames=[];
  currentRecipes='loading';recipesView='cards';
  render();
  const anchor=document.getElementById('recipe-results');
  if(anchor)anchor.scrollIntoView({behavior:'smooth',block:'start'});
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-opus-4-8',
        max_tokens:4000,
        output_config:{format:{type:'json_schema',schema:RECIPE_SCHEMA}},
        messages:[{role:'user',content:buildRecipePrompt(req,grocery)}]
      })
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message||'API error');
    if(data.stop_reason==='refusal')throw new Error('The model declined this request — try rephrasing.');
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')||'';
    let parsed;
    try{parsed=JSON.parse(text);}
    catch(e){
      const m=text.match(/\{[\s\S]*\}/);
      if(!m)throw new Error('No recipe data in the response.');
      parsed=JSON.parse(m[0]);
    }
    const recipes=parsed.recipes||[];
    if(!recipes.length)throw new Error('No recipes returned — try again.');
    shownRecipeNames.push(...recipes.map(r=>r.name));
    currentRecipes=recipes;
    recipesHeadline=parsed.headline||'Tonight’s picks';
  }catch(e){
    currentRecipes={error:e.message+' — recipe generation calls the Anthropic API and works when this app runs inside claude.ai; on other hosts it needs an API proxy.'};
  }
  render();
}

}
function toggleStep(i){
  if(cookRecipe.done.has(i))cookRecipe.done.delete(i);else cookRecipe.done.add(i);
  renderCookMode();
}
function exitCookMode(){
  document.getElementById('cookmode').classList.remove('on');
  document.body.style.overflow='';
}
function finishCooking(){
  const idx=cookRecipe.idx,cbId=cookRecipe.cbId;
  exitCookMode();
  madeThisSheet(idx,cbId);
}

/* ── "I MADE THIS" — closes the loop back to the inventory ───────────── */
function madeThisSheet(idx,cbId){
  const r=resolveRecipe(idx,cbId);
  if(!r)return;
  const matches=matchInventory(r);
  openSheet(`
    <div class="sheet-title">Nice cooking! 🎉</div>
    <div class="sheet-sub">Mark the ingredients you finished as used up — they'll leave your kitchen.</div>
    ${matches.length?matches.map(m=>`
      <label class="togglerow" style="margin-top:10px"><input type="checkbox" class="made-chk" value="${m.item.id}" checked>
      <span style="text-transform:capitalize">${esc(m.item.displayName||m.item.name)}</span>
      <span style="color:var(--faint);font-size:11px;margin-left:auto">${esc(m.ing)}</span></label>`).join('')
    :'<p style="font-size:13px;color:var(--muted);margin-top:12px">No inventory items matched this recipe’s ingredients.</p>'}
    <div class="sheet-actions">
      <button class="btn" onclick="closeSheet()">Keep everything</button>
      <button class="btn btn-primary" onclick="confirmMade(${cbId?`null,'${cbId}'`:idx})">Confirm</button>
    </div>
  `);
}
function matchInventory(r){
  const out=[];
  for(const g of(r.ings||[])){
    const gn=g.n.toLowerCase();
    for(const it of state.items){
      const iname=(it.displayName||it.name).toLowerCase();
      const hit=gn.includes(iname)||iname.includes(gn)||
        iname.split(/\s+/).some(w=>w.length>3&&gn.includes(w));
      if(hit&&!out.some(o=>o.item.id===it.id)){out.push({item:it,ing:g.n});break;}
    }
  }
  return out;
}
function confirmMade(idx,cbId){
  const r=resolveRecipe(idx,cbId);
  const ids=[...document.querySelectorAll('.made-chk:checked')].map(c=>c.value);
  snapshot();
  state.items=state.items.filter(i=>!ids.includes(i.id));
  let cb=cbId?state.cookbook.find(c=>c.id===cbId):(r?state.cookbook.find(c=>c.recipe.name===r.name):null);
  if(!cb&&r){cb={id:uid(),savedAt:Date.now(),timesCooked:0,recipe:r};state.cookbook.push(cb);}
  if(cb)cb.timesCooked=(cb.timesCooked||0)+1;
  save();closeSheet();
  recipesView='cards';
  render();
  toast(ids.length?`${ids.length} ingredient${ids.length===1?'':'s'} used up — recipe saved to cookbook`:'Recipe saved to cookbook',{undo});
}

/* ════════════════════════════════════════════════════════════════════════
   SHOPPING TAB
   ════════════════════════════════════════════════════════════════════════ */
function shoppingHTML(){
  const open=state.shopping.filter(s=>!s.checked);
  const done=state.shopping.filter(s=>s.checked);
  let html=`
  <div class="addbar">
    <input class="field" id="shop-inp" placeholder="Add to shopping list…" autocomplete="off" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();addShopItem()}">
    <button class="btn btn-primary" onclick="addShopItem()">Add</button>
  </div>`;
  if(!state.shopping.length){
    html+=`<div class="empty">
      <span data-sprite="can of beans" data-size="56px"></span>
      <div class="big">Shopping list is empty</div>
      <p>Add items here, or turn on grocery mode when<br>suggesting recipes and pull items straight in.<br><br>Checking an item off adds it to your kitchen.</p>
    </div>`;
    return html;
  }
  html+=`<div class="ilist" style="margin-top:16px">`;
  for(const s of open)html+=shopRowHTML(s);
  html+=`</div>`;
  if(done.length){
    html+=`<div class="group-hd" style="margin-top:20px">In the kitchen<span class="cnt">${done.length}</span></div><div class="ilist">`;
    for(const s of done)html+=shopRowHTML(s);
    html+=`</div><div class="datarow"><button class="btn-ghost" onclick="clearDoneShop()">Clear completed</button></div>`;
  }
  return html;
}
function shopRowHTML(s){
  return`<div class="shoprow ${s.checked?'done':''}">
    <input type="checkbox" ${s.checked?'checked':''} onchange="toggleShop('${s.id}')">
    <span class="shop-name">${esc(s.name)}</span>
    ${s.qty?`<span class="shop-qty">${esc(s.qty)}</span>`:''}
    ${s.from?`<span class="shop-from" title="${esc(s.from)}">${esc(s.from)}</span>`:''}
    <button class="shop-x" onclick="removeShop('${s.id}')">✕</button>
  </div>`;
}
function addShopItem(){
  const inp=document.getElementById('shop-inp');
  const raw=(inp?.value||'').trim();
  if(!raw)return;
  snapshot();
  raw.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean).forEach(name=>{
    state.shopping.push({id:uid(),name,qty:'',checked:false,from:''});
  });
  inp.value='';
  save();render();
}
function toggleShop(id){
  const s=state.shopping.find(x=>x.id===id);
  if(!s)return;
  snapshot();
  s.checked=!s.checked;
  if(s.checked){
    // Checking off = you bought it → it lands in the kitchen with today's date
    const cls=classify(s.name);
    const it=makeItem(s.name,s.name,cls.zone,cls.cat);
    it.qty=s.qty||'';
    state.items.push(it);
    toast(`${s.name} added to your ${cls.zone}`,{undo});
  }
  save();render();
}
function removeShop(id){
  snapshot();
  state.shopping=state.shopping.filter(s=>s.id!==id);
  save();render();
}
function clearDoneShop(){
  snapshot();
  state.shopping=state.shopping.filter(s=>!s.checked);
  save();render();
}

/* ── BOOT ────────────────────────────────────────────────────────────── */
(async()=>{
  await load();
  initFridgeDrag();
  render();
})();
</script>
